name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

jobs:
  syntax-and-smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        shell: bash
        run: zsh tests/smoke.zsh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint installer scripts
        run: shellcheck scripts/install.sh scripts/uninstall.sh
